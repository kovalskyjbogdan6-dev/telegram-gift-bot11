<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Darikum</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <style>
        body {
            background: radial-gradient(circle at center, #0f172a, #020617);
            color: #f8fafc;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }
        .glow { filter: drop-shadow(0 0 15px rgba(59, 130, 246, 0.6)); }
        .spin-slow { animation: spin 8s linear infinite; }
        @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
    </style>
</head>
<body class="select-none overflow-hidden h-screen flex flex-col justify-between p-4">

    <div id="screen-main" class="flex-1 flex flex-col items-center justify-center space-y-6">
        <div class="text-center">
            <h1 class="text-3xl font-extrabold tracking-wider text-blue-400">DARIKUM</h1>
            <p class="text-xs text-slate-400 mt-1">Удача на твоей стороне</p>
        </div>

        <div id="case-box" class="relative my-8 cursor-pointer transform active:scale-95 transition flex items-center justify-center h-48 w-48" onclick="openCase()">
            <div class="absolute inset-0 bg-blue-500/10 rounded-full blur-xl spin-slow"></div>
            <span class="text-8xl glow">🎁</span>
        </div>

        <button onclick="openCase()" class="w-full max-w-xs bg-gradient-to-r from-blue-600 to-indigo-600 hover:from-blue-500 hover:to-indigo-500 text-white font-bold py-3.5 px-6 rounded-2xl shadow-lg shadow-blue-500/20 transform active:scale-98 transition">
            Открыть Кейс (100 ⭐)
        </button>
    </div>

    <div id="screen-animation" class="hidden flex-1 flex flex-col items-center justify-center space-y-6">
        <div class="relative flex items-center justify-center h-56 w-56">
            <div class="absolute inset-0 bg-cyan-500/20 rounded-full blur-2xl animate-ping"></div>
            <span class="text-8xl animate-bounce">📦</span>
        </div>
        <h2 class="text-xl font-bold text-cyan-400 animate-pulse">Генерация подарка...</h2>
    </div>

    <div id="screen-result" class="hidden flex-1 flex flex-col items-center justify-center space-y-6">
        <h2 class="text-2xl font-black text-emerald-400">Ты получил подарок!</h2>
        <div class="bg-slate-900/60 border border-slate-800 rounded-3xl p-8 flex flex-col items-center space-y-4 w-64 shadow-2xl backdrop-blur-md">
            <span id="result-icon" class="text-7xl glow">🐕</span>
            <div class="text-center">
                <div id="result-name" class="font-bold text-lg text-white">Pudgy Dog</div>
                <div id="result-rarity" class="text-xs font-semibold px-2 py-0.5 rounded-full bg-amber-500/20 text-amber-400 mt-1 inline-block">Легендарный</div>
            </div>
        </div>
        <button onclick="showScreen('main')" class="w-full max-w-xs bg-slate-800 hover:bg-slate-700 text-white font-medium py-3 rounded-xl transition">
            В главное меню
        </button>
    </div>

    <div id="screen-collection" class="hidden flex-1 flex flex-col">
        <h2 class="text-xl font-bold mb-4 text-slate-300">Моя коллекция</h2>
        <div id="collection-list" class="flex-1 overflow-y-auto grid grid-cols-2 gap-3 pb-4">
        </div>
    </div>

    <div class="grid grid-cols-2 gap-2 bg-slate-900/80 border border-slate-800/50 p-1.5 rounded-2xl backdrop-blur-md">
        <button onclick="showScreen('main')" id="nav-main" class="py-2.5 rounded-xl font-medium text-sm text-blue-400 bg-slate-800/60 transition">🕹️ Кейсы</button>
        <button onclick="loadCollection()" id="nav-collection" class="py-2.5 rounded-xl font-medium text-sm text-slate-400 hover:text-slate-200 transition">🎒 Инвентарь</button>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();
        
        const BACKEND_URL = window.location.origin; 
        const initData = tg.initData || "";

        function showScreen(screenName) {
            ['main', 'animation', 'result', 'collection'].forEach(s => {
                document.getElementById(`screen-${s}`).classList.add('hidden');
            });
            document.getElementById(`screen-${screenName}`).classList.remove('hidden');
            
            document.getElementById('nav-main').className = `py-2.5 rounded-xl font-medium text-sm ${screenName === 'main' ? 'text-blue-400 bg-slate-800/60' : 'text-slate-400'}`;
            document.getElementById('nav-collection').className = `py-2.5 rounded-xl font-medium text-sm ${screenName === 'collection' ? 'text-blue-400 bg-slate-800/60' : 'text-slate-400'}`;
        }

        async function openCase() {
            showScreen('animation');
            try {
                const response = await fetch(`${BACKEND_URL}/api/open-case`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ init_data: initData })
                });
                const data = await response.json();
                setTimeout(() => {
                    document.getElementById('result-icon').innerText = data.icon;
                    document.getElementById('result-name').innerText = data.name;
                    document.getElementById('result-rarity').innerText = data.rarity;
                    showScreen('result');
                    if (tg.HapticFeedback) tg.HapticFeedback.notificationOccurred('success');
                }, 2000);
            } catch (err) {
                console.error(err);
                showScreen('main');
                alert("Ошибка соединения с сервером.");
            }
        }

        async function loadCollection() {
            showScreen('collection');
            const list = document.getElementById('collection-list');
            list.innerHTML = '<div class="col-span-2 text-center text-slate-500 py-8">Загрузка...</div>';
            try {
                const response = await fetch(`${BACKEND_URL}/api/collection?init_data=${encodeURIComponent(initData)}`);
                const items = await response.json();
                list.innerHTML = '';
                if (items.length === 0) {
                    list.innerHTML = '<div class="col-span-2 text-center text-slate-500 py-8">У вас пока нет подарков</div>';
                    return;
                }
                items.forEach(item => {
                    const card = document.createElement('div');
                    card.className = "bg-slate-900/40 border border-slate-800/60 rounded-2xl p-4 flex flex-col items-center justify-center space-y-2 text-center";
                    card.innerHTML = `<span class="text-4xl">${item.icon}</span><div class="text-sm font-bold text-white">${item.name}</div><span class="text-[10px] text-slate-400">${item.rarity}</span>`;
                    list.appendChild(card);
                });
            } catch (err) {
                list.innerHTML = '<div class="col-span-2 text-center text-red-400 py-8">Не удалось загрузить инвентарь</div>';
            }
        }
    </script>
</body>
</html>
