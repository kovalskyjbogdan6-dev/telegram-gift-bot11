    <style>
        /* Базовые стили и глубокий темно-синий фон из макета */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
        }
        body {
            background: linear-gradient(180deg, #09122c 0%, #030712 100%);
            color: #f8fafc;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            height: 100vh;
            display: flex;
            flex-col: column;
            flex-direction: column;
            justify-content: space-between;
            padding: 16px;
            overflow: hidden;
        }

        /* Верхняя панель */
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            padding-bottom: 12px;
        }
        .logo-text {
            font-size: 20px;
            font-weight: 900;
            letter-spacing: 1px;
            background: linear-gradient(90deg, #60a5fa, #a5b4fc);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .balance-badge {
            background: rgba(30, 27, 75, 0.6);
            border: 1px solid rgba(99, 102, 241, 0.3);
            padding: 6px 14px;
            border-radius: 9999px;
            font-size: 12px;
            font-weight: 900;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        /* Контентная зона и управление экранами */
        .content-area {
            flex: 1;
            width: 100%;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }
        .screen {
            display: none; /* Прячет неактивные экраны, предотвращая наслоение текста */
            width: 100%;
        }
        .screen.active {
            display: block; /* Показывает только выбранную вкладку */
        }

        /* Полупрозрачные карточки (Glassmorphism) */
        .glass-panel {
            background: rgba(15, 23, 42, 0.5);
            border: 1px solid rgba(99, 102, 241, 0.2);
            border-radius: 20px;
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
        }

        /* Сетка кейсов (Экран 1) */
        .cases-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
        }
        .cases-header h2 {
            font-size: 18px;
            font-weight: 900;
            color: #c7d2fe;
        }
        .cases-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
        }
        .case-card {
            padding: 12px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            text-align: center;
            min-height: 140px;
            transition: transform 0.1s ease;
            cursor: pointer;
        }
        .case-card:active {
            transform: scale(0.95);
        }
        .case-title {
            font-size: 11px;
            font-weight: 700;
            color: #94a3b8;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            width: 100%;
        }
        .case-icon {
            font-size: 42px;
            margin: 8px 0;
            filter: drop-shadow(0 0 10px rgba(99, 102, 241, 0.3));
        }
        .case-price {
            background: rgba(15, 23, 42, 0.8);
            border: 1px solid rgba(99, 102, 241, 0.3);
            padding: 4px 8px;
            border-radius: 8px;
            font-size: 11px;
            font-weight: 700;
            color: #fbbf24;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        /* Каталог подарков (Экран 2) */
        .search-container {
            position: relative;
            width: 100%;
            margin-bottom: 16px;
        }
        .search-input {
            width: 100%;
            background: rgba(2, 6, 23, 0.8);
            border: 1px solid #1e293b;
            color: #fff;
            border-radius: 12px;
            padding: 12px 12px 12px 36px;
            font-size: 14px;
            outline: none;
        }
        .search-icon {
            position: absolute;
            left: 12px;
            top: 13px;
            color: #475569;
        }
        .catalog-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 14px;
            padding-bottom: 16px;
        }
        .catalog-card {
            padding: 16px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            cursor: pointer;
            transition: transform 0.1s ease;
        }
        .catalog-card:active {
            transform: scale(0.95);
        }
        .catalog-card .item-icon {
            font-size: 48px;
            margin-bottom: 8px;
        }
        .catalog-card .item-name {
            font-size: 13px;
            font-weight: 900;
            color: #fff;
            margin-bottom: 2px;
        }
        .catalog-card .item-stars {
            font-size: 11px;
            font-weight: 700;
            color: #fbbf24;
            margin-bottom: 6px;
        }
        .badge {
            font-size: 8px;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 1px;
            padding: 3px 8px;
            border-radius: 9999px;
            border: 1px solid;
            display: inline-block;
        }
        .badge-legendary { color: #fbbf24; background: rgba(251, 191, 36, 0.1); border-color: rgba(251, 191, 36, 0.2); }
        .badge-rare { color: #c084fc; background: rgba(192, 132, 252, 0.1); border-color: rgba(192, 132, 252, 0.2); }

        /* Детали подарка (Экран 3) */
        .details-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 16px;
        }
        .back-btn {
            align-self: flex-start;
            background: none;
            border: none;
            color: #94a3b8;
            font-weight: 700;
            font-size: 14px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 4px;
        }
        .details-main-card {
            width: 100%;
            padding: 24px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 16px;
            text-align: center;
        }
        .details-icon-box {
            background: rgba(30, 27, 75, 0.4);
            border: 1px solid rgba(99, 102, 241, 0.1);
            padding: 12px;
            border-radius: 16px;
            font-size: 64px;
            box-shadow: 0 0 20px rgba(99, 102, 241, 0.3);
        }
        .details-info-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            width: 100%;
        }
        .info-box {
            padding: 14px;
            border-radius: 16px;
        }
        .info-label {
            font-size: 10px;
            font-weight: 700;
            color: #64748b;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 2px;
        }
        .info-val {
            font-size: 14px;
            font-weight: 900;
        }
        .info-val-stars { color: #fbbf24; }
        .action-button {
            width: 100%;
            background: linear-gradient(90deg, #2563eb, #4f46e5);
            border: none;
            border-top: 1px solid rgba(255, 255, 255, 0.2);
            color: #fff;
            font-size: 14px;
            font-weight: 900;
            padding: 16px;
            border-radius: 16px;
            cursor: pointer;
            box-shadow: 0 4px 14px rgba(49, 46, 129, 0.5);
            transition: transform 0.1s ease;
        }
        .action-button:active {
            transform: scale(0.98);
        }

        /* Инвентарь (Экран 4) */
        .empty-state {
            padding: 32px;
            text-align: center;
            color: #64748b;
            font-size: 12px;
            line-height: 1.6;
        }

        /* Фиксированное меню вкладок снизу */
        .bottom-nav {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
            background: #020617;
            border: 1px solid #111827;
            padding: 6px;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            z-index: 30;
        }
        .nav-btn {
            background: transparent;
            border: 1px solid transparent;
            color: #64748b;
            border-radius: 12px;
            padding: 10px 0;
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 2px;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .nav-btn span:first-child {
            font-size: 16px;
        }

];
function redirectToAdmin(itemName) {
if (tg && tg.HapticFeedback) tg.HapticFeedback.impactOccurred('medium');
const textMessage = encodeURIComponent(Привет! Я хочу приобрести/открыть: ${itemName});
const adminLink = https://t.me{textMessage};
if (tg) {
tg.openTelegramLink(adminLink);
} else {
window.open(adminLink, '_blank');
}
}
function changeTab(tabName) {
// Переключаем видимость экранов через добавление/удаление класса active
['cases', 'catalog', 'details', 'collection'].forEach(t => {
const screen = document.getElementById(screen-${t});
if (screen) screen.classList.remove('active');
});
const targetScreen = document.getElementById(screen-${tabName});
if (targetScreen) targetScreen.classList.add('active');
// Управляем видимостью верхней панели баланса
const topBar = document.getElementById('app-top-bar');
if (topBar) {
if (tabName === 'details') {
topBar.style.display = 'none';
} else {
topBar.style.display = 'flex';
}
}
// Подсвечиваем кнопки меню
['cases', 'catalog', 'collection'].forEach(b => {
const btn = document.getElementById(btn-${b});
if (btn) {
if (tabName === b) {
btn.classList.add('active');
} else {
btn.classList.remove('active');
}
}
});
if (tabName === 'catalog') renderCatalog();
}
function renderCatalog() {
const grid = document.getElementById('catalog-grid');
if (!grid) return;
grid.innerHTML = '';
ITEMS_DATA.forEach(item => {
const badgeClass = item.rarity === 'Легендарный' ? 'badge-legendary' : 'badge-rare';
const card = document.createElement('div');
card.className = "glass-panel catalog-card";
card.onclick = () => showDetails(item);
card.innerHTML = <span class="item-icon">${item.icon}</span> <div class="item-name">${item.name}</div> <div class="item-stars">⭐ ${item.stars}</div> <span class="badge ${badgeClass}">${item.rarity}</span>;
grid.appendChild(card);
});
}
function showDetails(item) {
document.getElementById('det-icon').innerText = item.icon;
document.getElementById('det-name').innerText = item.name;
document.getElementById('det-stars').innerText = item.stars;
document.getElementById('det-ton').innerText = item.ton;
document.getElementById('det-desc').innerText = item.desc;
const rarityBadge = document.getElementById('det-rarity');
if (rarityBadge) {
rarityBadge.innerText = item.rarity;
rarityBadge.className = item.rarity === 'Легендарный' ? 'badge badge-legendary' : 'badge badge-rare';
}
const buyBtn = document.getElementById('btn-buy-now');
if (buyBtn) {
buyBtn.onclick = () => redirectToAdmin(Покупка предмета ${item.name});
}
changeTab('details');
}
